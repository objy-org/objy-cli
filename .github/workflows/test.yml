name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run

  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Use release npm CLI
        run: |
          npm config delete always-auth --location=user
          npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:package
      - run: npm pack
      - run: npm install --global --prefix "$RUNNER_TEMP/cli-smoke" ./objy-cli-*.tgz
      - run: '"$RUNNER_TEMP/cli-smoke/bin/objy" --help'
