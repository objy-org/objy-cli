x}.confirm-dialog{max-width:440px}.confirm-dialog .dialog-body{color:var(--muted);font-size:13px;line-height:1.7}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);border:1px solid #3a644d;border-radius:12px;background:#173224;color:var(--text);padding:12px 22px;font-size:13px;z-index:20;box-shadow:0 8px 40px #0005}

<body>
  <header class="topbar"><div class="topbar-inner">
    <button class="brand" data-nav="clusters" aria-label="Objy home">objy<span>.</span></button>
    <nav aria-label="Main navigation"><button id="nav-clusters" class="active" data-nav="clusters">Clusters</button><button id="nav-checks" data-nav="checks">Setup checks</button></nav>
    <span class="local-badge"><span class="dot"></span> Running locally</span>
  </div></header>
  <main>
    <div id="notice" class="notice" role="alert" hidden></div>
    <div id="content"><p class="muted">Loading your clusters…</p></div>
    <p class="footnote"><span class="dot"></span> Your clusters. On your infrastructure.</p>
  </main>
  <dialog id="wizard" aria-labelledby="wizard-title">
    <form id="deploy-form" novalidate>
      <div class="dialog-head"><div><h2 id="wizard-title">Deploy a cluster</h2><p id="wizard-subtitle"></p></div><button type="button" class="icon-button" id="close-wizard" aria-label="Close setup">×</button></div>
      <div class="steps" id="wizard-steps" aria-hidden="true"></div>
      <div class="dialog-body"><div id="wizard-fields"></div><div id="wizard-error" class="notice form-error" role="alert" hidden></div></div>
      <div class="dialog-actions"><button type="button" class="button quiet" id="previous-step">Back</button><small id="step-count"></small><button type="submit" class="button primary" id="next-step">Continue →</button></div>
    </form>
  </dialog>
  <dialog id="confirmation" class="confirm-dialog" aria-labelledby="confirm-title">
    <form id="confirm-form"><div class="dialog-head"><h2 id="confirm-title"></h2><button type="button" class="icon-button" id="close-confirmation" aria-label="Cancel">×</button></div><div class="dialog-body" id="confirm-description"></div><div class="dialog-actions"><button type="button" class="button quiet" id="cancel-action">Cancel</button><button type="submit" class="button primary" id="confirm-action"></button></div></form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" nonce="__NONCE__">
    import { targets, presets, storageChoices, wizardFields, validateField, capacity } from '/catalog.js';
    const $ = selector => document.querySelector(selector);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const token = $('meta[name="objy-token"]').content;
    const content = $('#content');
    let view = 'clusters', selected = null, tab = 'topology', clusters = [], jobs = [], detail = null;
    let provided = [], timer, refreshing = false, detailAt = 0, logAt = 0, logNode = '', logs = '', follow = false;
    let checkTarget = 'docker', checkProtocol = 'http', checkResult = null, checking = false;
    let step = 0, answers = {}, submitting = false, pendingAction = null, toastTimer;
    const paths = {
      cpu: '<rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 1v4m6-4v4M9 19v4m6-4v4M1 9h4m-4 6h4m14-6h4m-4 6h4"/><rect x="9" y="9" width="6" height="6" rx="1"/>',
      plus: '<path d="M12 5v14M5 12h14"/>', arrow: '<path d="m9 5 7 7-7 7"/>',
      back: '<path d="m12 5-7 7 7 7M5 12h15"/>', refresh: '<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 18 17"/>',
      storage: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',
      copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>'
    };
    const icon = name => '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths[name] + '</svg>';
    const label = target => targets.find(t => t.value === (target === 'local' ? 'node-process' : target))?.label || target || 'Cluster';
    const urlSafe = value => { try { const u = new URL(value); return ['http:','https:'].includes(u.protocol) && !u.username && !u.password ? u.href : ''; } catch { return ''; } };
    const badge = state => '<span class="badge ' + (['ready','running'].includes(state) ? 'good' : ['failed','unavailable','interrupted'].includes(state) ? 'bad' : ['working','starting','pending','preparing','storage','runtime','readiness','shard-map'].includes(state) ? 'warn' : '') + '">' + esc(state || 'unknown') + '</span>';
    const jobFor = name => jobs.findLast(job => job.name === name);
    const busy = name => jobs.some(job => job.name === name && job.status === 'running');
    function notice(message) { $('#notice').textContent = message; $('#notice').hidden = !message; }
    function toast(message) { clearTimeout(toastTimer); $('#toast').textContent = message; $('#toast').hidden = false; toastTimer = setTimeout(() => { $('#toast').hidden = true; }, 3000); }
    async function api(path, body) {
      const response = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: {'x-objy-token': token, ...(body === undefined ? {} : {'content-type':'application/json'})}, body: body === undefined ? undefined : JSON.stringify(body), signal: AbortSignal.timeout(60000) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    }
    async function refresh(force = false) {
      if (refreshing) return;
      refreshing = true;
      try {
        [clusters, jobs] = await Promise.all([api('/api/clusters'), api('/api/jobs')]);
        if (selected && clusters.some(c => c.name === selected) && (force || Date.now() - detailAt > 7000)) {
          const name = selected, result = await api('/api/clusters/' + encodeURIComponent(name));
          if (selected === name) { detail = result; detailAt = Date.now(); }
        }
        if (view === 'detail' && tab === 'logs' && (force || follow && Date.now() - logAt > 1800)) await loadLogs();
        if (view !== 'checks') render();
      } catch (error) { notice(error.message); }
      finally {
        refreshing = false; clearTimeout(timer);
        timer = setTimeout(() => { if (!document.hidden) refresh(); }, jobs.some(j => j.status === 'running') || follow && view === 'detail' && tab === 'logs' ? 2000 : 10000);
      }
    }
    let rendered = '';
    function render() {
      $('#nav-clusters').classList.toggle('active', view !== 'checks'); $('#nav-checks').classList.toggle('active', view === 'checks');
      const previousLog = $('#logs'), oldScroll = previousLog?.scrollTop || 0, atBottom = previousLog && previousLog.scrollHeight - previousLog.scrollTop - previousLog.clientHeight < 50;
      const next = view === 'clusters' ? dashboard() : view === 'checks' ? checksPage() : detailPage();
      if (next !== rendered) { content.innerHTML = next; rendered = next; }
      if ($('#logs')) $('#logs').scrollTop = follow && atBottom ? $('#logs').scrollHeight : oldScroll;
    }
    function activity(job) {
      return '<div class="panel activity">' + (job.status === 'running' ? '<span class="spinner" aria-label="Working"></span>' : badge(job.status)) + '<div class="activity-copy"><strong>' + esc(job.name) + '</strong><p>' + esc(job.events.at(-1)?.message || 'Preparing your cluster…') + '</p></div><button class="button small quiet" data-open="' + esc(job.name) + '">View ' + icon('arrow') + '</button></div>';
    }
    function dashboard() {
      return '<div class="heading"><div><div class="eyebrow">Your workspace</div><h1>Your clusters <span class="count">' + clusters.length + '</span></h1><p>Deploy, explore and manage. All in one place.</p></div><button class="button primary" data-deploy>' + icon('plus') + ' Deploy cluster</button></div>' +
        jobs.filter(j => j.status === 'running' || j.status === 'failed' && !clusters.some(c => c.name === j.name)).map(activity).join('') +
        (clusters.length ? '<div class="cards">' + clusters.map(c => '<button class="panel cluster-card" data-open="' + esc(c.name) + '"><div class="card-top"><span class="target">' + esc(label(c.target)) + '</span>' + badge(busy(c.name) ? 'working' : c.state) + '</div><h2>' + esc(c.name) + '</h2><span class="endpoint">' + esc(c.topology?.endpoint || 'Endpoint available after setup') + '</span><div class="metrics"><div><small>Nodes</small><strong>' + esc(c.capacity?.nodes ?? '—') + '</strong></div><div><small>Memory / node</small><strong>' + esc(c.capacity ? c.capacity.heapMb / 1024 + ' GiB' : '—') + '</strong></div><div><small>Location</small><strong>' + esc(c.region || (['docker','local'].includes(c.target) ? 'This device' : 'Your VMs')) + '</strong></div></div></button>').join('') + '</div>' :
        '<section class="panel empty"><div class="cluster-art" aria-hidden="true"><span class="art-node">' + icon('cpu') + '</span><span class="art-node">' + icon('cpu') + '</span><span class="art-node">' + icon('cpu') + '</span></div><h2>Your next cluster starts here.</h2><p>Choose where it runs and how big it should be.<br>We’ll guide you through the rest.</p><button class="button primary" data-deploy>' + icon('plus') + ' Deploy your first cluster</button><div class="platforms">Local · Docker · VMs · Hetzner</div></section>');
    }
    function detailPage() {
      const c = detail?.name === selected ? detail : clusters.find(c => c.name === selected);
      const job = jobFor(selected), working = busy(selected) || c?.state === 'working';
      const pending = c && (c.phase !== 'ready' || c.management?.operation?.status === 'pending');
      const endpoint = urlSafe(c?.topology?.endpoint);
      const controls = pending ? '<button class="button primary small" data-action="resume"' + (working ? ' disabled' : '') + '>Resume</button>' :
        ['start','stop','restart'].map(action => '<button class="button small" data-action="' + action + '"' + (working || !c || action === 'stop' && c.state === 'stopped' || action === 'restart' && c.state === 'stopped' ? ' disabled' : '') + '>' + action[0].toUpperCase() + action.slice(1) + '</button>').join('');
      let html = '<button class="back" data-nav="clusters">' + icon('back') + ' All clusters</button><div class="heading"><div><div class="title-row"><h1>' + esc(selected) + '</h1>' + badge(working ? 'working' : c?.state || job?.status || 'pending') + '</div><p>' + esc(c ? label(c.target) + ' · ' + (c.capacity?.nodes || 0) + ' nodes' + (c.release ? ' · ' + c.release.version : '') : 'Preparing your deployment') + '</p></div><div class="actions">' + controls + '<button class="button small quiet" data-refresh aria-label="Refresh cluster">' + icon('refresh') + '</button></div></div>';
      const error = c?.management?.operation?.error || c?.error || (job?.status === 'failed' ? job.error : '');
      if (error) html += '<div class="notice" role="alert">' + esc(error) + '</div>';
      if (c?.stale) html += '<div class="notice info">Live status is unavailable. Showing the last saved topology.</div>';
      if (c?.dns) html += '<div class="notice info">Point the DNS A record for ' + esc(c.dns.domain) + ' to ' + esc(c.dns.address) + '.</div>';
      html += '<section class="panel endpoint-bar"><div><small>CLIENT ENDPOINT</small>' + (endpoint ? '<a href="' + esc(endpoint) + '" target="_blank" rel="noopener noreferrer">' + esc(c.topology.endpoint) + '</a>' : '<span class="muted">Available when your cluster is ready</span>') + '</div>' + (endpoint ? '<button class="button small quiet" data-copy="' + esc(c.topology.endpoint) + '" aria-label="Copy endpoint">' + icon('copy') + '</button>' : '') + '</section>';
      html += '<div class="tabs" role="group" aria-label="Cluster views"><button data-tab="topology" class="' + (tab === 'topology' ? 'active' : '') + '">Topology</button><button data-tab="logs" class="' + (tab === 'logs' ? 'active' : '') + '">Logs</button></div>';
      if (tab === 'logs') html += logsPanel(c);
      else {
        const groups = Map.groupBy(c?.topology?.nodes || [], node => node.shard);
        html += '<section class="panel topology"><div class="panel-title"><h2>Cluster topology</h2><small>' + (c?.topology ? c.topology.nodes.filter(n => n.status === 'ready').length + ' / ' + c.topology.nodes.length + ' ready' : 'Waiting for nodes') + '</small></div>';
        html += groups.size ? '<div class="shards">' + [...groups].map(([shard, nodes], i) => '<section class="shard"><h3>Shard ' + (i + 1) + '</h3>' + nodes.map(n => '<div class="node"><div class="node-top"><strong>Node ' + esc(n.replica) + '</strong>' + badge(n.status) + '</div><code>' + esc(n.address || 'Address unavailable') + '</code><small>' + esc(n.heapMb / 1024) + ' GiB memory</small></div>').join('') + '</section>').join('') + '</div>' : '<p class="muted">Your nodes will appear here as setup progresses.</p>';
        if (c?.topology?.storage) html += '<div class="storage">' + icon('storage') + '<div><p>Shared storage · ' + (c.topology.storage.managed ? 'Automatically provisioned' : 'Existing S3') + '</p><small>' + esc(c.topology.storage.bucket) + '</small></div>' + (c.topology.storage.state && c.topology.storage.state !== 'external' ? badge(c.topology.storage.state) : '') + '</div>';
        html += '</section>';
      }
      const events = job?.events?.length ? job.events : c?.events || [];
      if (events.length) html += '<section class="panel progress"><div class="panel-title"><h2>' + (job?.status === 'running' ? 'In progress' : 'Activity') + '</h2>' + (job?.status === 'running' ? '<span class="spinner" aria-label="Working"></span>' : '') + '</div><ol class="events">' + events.map(e => '<li><time>' + esc(new Date(e.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})) + '</time><span>' + esc(e.message) + '</span></li>').join('') + '</ol></section>';
      return html;
    }
    function logsPanel(c) {
      return '<section class="panel log-panel"><div class="log-toolbar"><select id="log-node" aria-label="Log node"><option value="">All nodes</option>' + (c?.topology?.nodes || []).map(n => '<option value="' + esc(n.id) + '"' + (n.id === logNode ? ' selected' : '') + '>' + esc(n.address || n.id) + '</option>').join('') + '</select><div class="log-controls"><label class="check-label"><input id="follow-logs" type="checkbox"' + (follow ? ' checked' : '') + '> Follow logs</label><button class="button small quiet" data-log-refresh>' + icon('refresh') + ' Refresh</button></div></div><pre id="logs" tabindex="0" aria-label="Cluster logs">' + esc(logs || 'No logs loaded yet.') + '</pre></section>';
    }
    async function loadLogs() {
      const name = selected, node = logNode;
      let result;
      try { result = (await api('/api/clusters/' + encodeURIComponent(name) + '/logs?lines=150&node=' + encodeURIComponent(node))).logs; }
      catch (error) { result = error.message; }
      if (selected === name && logNode === node) { logs = result; logAt = Date.now(); }
    }
    function checksPage() {
      return '<div class="heading"><div><div class="eyebrow">Before you deploy</div><h1>Ready when you are.</h1><p>Check the tools your chosen platform needs.</p></div></div><section class="panel checks"><div class="check-toolbar"><select id="check-target" aria-label="Deployment platform">' + ['docker','local','vm','hetzner'].map(t => '<option value="' + t + '"' + (t === checkTarget ? ' selected' : '') + '>' + esc(label(t)) + '</option>').join('') + '</select><select id="check-protocol" aria-label="Connection protocol"><option value="http"' + (checkProtocol === 'http' ? ' selected' : '') + '>HTTP</option><option value="https"' + (checkProtocol === 'https' ? ' selected' : '') + '>HTTPS</option></select><button class="button primary" data-check' + (checking ? ' disabled' : '') + '>' + (checking ? 'Checking…' : 'Check setup') + '</button></div><div class="check-results">' + (checkResult ? checkResult.checks.map(c => '<div class="check-row"><span class="check-symbol ' + (c.ok ? '' : 'bad') + '">' + (c.ok ? '✓' : '○') + '</span><div><strong>' + esc(c.name) + '</strong><p>' + esc(c.ok ? 'Ready' : c.detail) + '</p>' + (!c.ok && urlSafe(c.install) ? '<a href="' + esc(urlSafe(c.install)) + '" target="_blank" rel="noopener noreferrer">Installation guide ↗</a>' : '') + '</div></div>').join('') : '<p class="checks-empty">Choose a platform to see what’s ready and what needs installing.</p>') + '</div></section>';
    }
    function openWizard() {
      answers = { target: 'docker', preset: 'tiny', protocol: 'http' }; step = 0; submitting = false;
      renderWizard(); $('#wizard').showModal(); $('#wizard-fields input')?.focus();
    }
    function closeWizard() { if (submitting) return; $('#wizard').close(); answers = {}; $('#wizard-fields').replaceChildren(); }
    function renderWizard() {
      const titles = ['Where should it run?', 'Choose your size.', 'Make it yours.', 'Ready to deploy?'];
      $('#wizard-subtitle').textContent = titles[step]; $('#step-count').textContent = (step + 1) + ' of 4';
      $('#wizard-steps').innerHTML = [0,1,2,3].map(i => '<span class="step ' + (i <= step ? 'active' : '') + '"></span>').join('');
      $('#previous-step').textContent = step === 0 ? 'Cancel' : 'Back';
      $('#next-step').textContent = step === 3 ? 'Deploy cluster' : 'Continue →';
      $('#wizard-error').hidden = true;
      const fields = $('#wizard-fields'); fields.innerHTML = '';
      if (step === 3) {
        const size = capacity(answers);
        const rows = [['Name',answers.name],['Platform',label(answers.target)],['Size',(presets.find(p => p.value === answers.preset)?.label || 'Custom') + ' · ' + size.nodes + ' nodes'],['Memory per node',size.heapMb / 1024 + ' GiB'],['Connection',answers.protocol.toUpperCase() + (answers.domain ? ' · ' + answers.domain : '')]];
        if (answers.target === 'hetzner') rows.splice(2,0,['Location',answers.region || 'fsn1']);
        rows.push(['Storage', storageChoices(answers.target).find(s => s.value === answers.storage)?.label || 'Automatic']);
        fields.innerHTML = '<div class="review">' + rows.map(([key,value]) => '<div class="review-row"><span>' + esc(key) + '</span><strong>' + esc(value) + '</strong></div>').join('') + '</div><p class="review-note">' + (answers.target === 'hetzner' ? 'This creates cloud resources in your Hetzner account. Your provider’s usage charges apply.' : 'Your cluster will be installed and started with these settings.') + '</p>';
        return;
      }
      let group = '';
      for (const field of wizardFields(answers, step)) {
        if (field.group && field.group !== group) { group = field.group; const title = document.createElement('div'); title.className = 'vm-title'; title.textContent = group; fields.append(title); }
        const container = document.createElement('div'); container.className = 'field';
        const fieldLabel = document.createElement('label'); fieldLabel.textContent = field.label; fieldLabel.htmlFor = 'field-' + field.id; container.append(fieldLabel);
        if (['target','preset'].includes(field.id) || field.id === 'storage' && ['docker','node-process'].includes(answers.target)) {
          const choices = document.createElement('div'); choices.className = 'choices'; choices.setAttribute('role','group'); choices.setAttribute('aria-label',field.label);
          for (const option of field.options) {
            const button = document.createElement('button'); button.type = 'button'; button.className = 'choice' + ((answers[field.id] || field.defaultValue) === option.value ? ' selected' : '') + (option.value === 'custom' ? ' wide' : '');
            button.dataset.choice = field.id; button.dataset.value = option.value; button.setAttribute('aria-pressed',String((answers[field.id] || field.defaultValue) === option.value));
            button.innerHTML = '<strong>' + esc(option.label) + '</strong><small>' + esc(option.description) + '</small>'; choices.append(button);
          }
          fieldLabel.removeAttribute('for'); container.append(choices);
        } else {
          const control = document.createElement(field.options ? 'select' : 'input'); control.id = 'field-' + field.id; control.name = field.id;
          if (field.options) for (const item of field.options) { const option = document.createElement('option'); option.value = item.value; option.textContent = item.label; control.append(option); }
          else { control.type = field.type === 'number' ? 'number' : field.secret ? 'password' : field.type === 'url' ? 'url' : 'text'; control.autocomplete = field.secret ? 'new-password' : 'off'; }
          control.value = answers[field.id] ?? field.defaultValue ?? '';
          if (field.options && !field.options.some(o => o.value === control.value)) control.value = field.defaultValue;
          answers[field.id] = control.value;
          if (field.min !== undefined) control.min = field.min; if (field.max !== undefined) control.max = field.max; if (field.maxLength) control.maxLength = field.maxLength;
          if (field.secret && provided.includes(field.id)) control.placeholder = 'Provided by your environment';
          else control.placeholder = field.placeholder || (field.id === 'name' ? 'my-cluster' : field.required ? '' : 'Optional');
          control.required = field.required && !(field.secret && provided.includes(field.id));
          container.append(control);
        }
        if (field.help) { const help = document.createElement('small'); help.textContent = field.help; container.append(help); }
        fields.append(container);
      }
      if (step === 1) { const note = document.createElement('p'); note.className = 'size-note'; const count = capacity(answers).nodes; note.textContent = count + (count === 1 ? ' node' : ' nodes') + ' total. Memory is allocated per node.'; fields.append(note); }
    }
    function collectFields() {
      for (const field of $('#wizard-fields').querySelectorAll('[name]')) answers[field.name] = field.value;
    }
    function validateStep() {
      collectFields();
      for (const field of wizardFields(answers, step)) {
        if (field.secret && provided.includes(field.id) && !answers[field.id]) continue;
        try { answers[field.id] = validateField(field, answers[field.id]); }
        catch (error) { const control = $('#field-' + field.id); control?.setAttribute('aria-invalid','true'); control?.focus(); throw error; }
      }
      if (capacity(answers).nodes > 64) throw new Error('Choose at most 64 nodes.');
    }
    $('#wizard-fields').addEventListener('input', event => {
      if (event.target.name) { answers[event.target.name] = event.target.value; event.target.removeAttribute('aria-invalid'); }
      if (step === 1 && $('.size-note')) { const count = capacity(answers).nodes; $('.size-note').textContent = count + (count === 1 ? ' node' : ' nodes') + ' total. Memory is allocated per node.'; }
    });
    $('#wizard-fields').addEventListener('change', event => {
      if (!event.target.name) return;
      collectFields();
      if (event.target.tagName === 'SELECT') { const id = event.target.id; renderWizard(); $('#' + id)?.focus(); }
    });
    $('#wizard-fields').addEventListener('click', event => {
      const button = event.target.closest('[data-choice]'); if (!button) return;
      collectFields(); answers[button.dataset.choice] = button.dataset.value;
      if (button.dataset.choice === 'target') { delete answers.storage; delete answers.region; }
      renderWizard(); $('#wizard-fields [data-choice="' + button.dataset.choice + '"][data-value="' + button.dataset.value + '"]')?.focus();
    });
    $('#deploy-form').addEventListener('submit', async event => {
      event.preventDefault(); if (submitting) return;
      try {
        validateStep();
        if (step < 3) { step++; renderWizard(); $('#wizard .dialog-body').scrollTop = 0; $('#wizard-fields input, #wizard-fields button, #wizard-fields select')?.focus(); return; }
        submitting = true; $('#next-step').disabled = true; $('#next-step').textContent = 'Starting…';
        const job = await api('/api/deploy', { answers });
        jobs.push(job); submitting = false; closeWizard(); notice(''); view = 'clusters'; render(); await refresh(true);
      } catch (error) { $('#wizard-error').textContent = error.message; $('#wizard-error').hidden = false; $('#wizard-error').scrollIntoView({block:'nearest'}); }
      finally { submitting = false; $('#next-step').disabled = false; $('#next-step').textContent = step === 3 ? 'Deploy cluster' : 'Continue →'; }
    });
    $('#previous-step').onclick = () => { if (submitting) return; collectFields(); if (step === 0) closeWizard(); else { step--; renderWizard(); } };
    $('#close-wizard').onclick = closeWizard;
    $('#wizard').addEventListener('cancel', event => { event.preventDefault(); closeWizard(); });
    const closeConfirm = () => { pendingAction = null; $('#confirmation').close(); };
    $('#close-confirmation').onclick = closeConfirm; $('#cancel-action').onclick = closeConfirm;
    $('#confirmation').addEventListener('cancel', closeConfirm);
    $('#confirm-form').addEventListener('submit', async event => {
      event.preventDefault(); if (!pendingAction) return;
      const {name,action} = pendingAction; closeConfirm();
      try { notice(''); const job = await api('/api/clusters/' + encodeURIComponent(name) + '/actions', {action}); jobs.push(job); render(); await refresh(true); }
      catch (error) { notice(error.message); }
    });
    document.addEventListener('click', async event => {
      const button = event.target.closest('button'); if (!button || button.disabled) return;
      try {
        if (button.dataset.nav) { view = button.dataset.nav; if (view !== 'detail') selected = null; notice(''); render(); if (view === 'clusters') await refresh(true); }
        else if (button.hasAttribute('data-deploy')) openWizard();
        else if (button.dataset.open) { selected = button.dataset.open; view = 'detail'; tab = 'topology'; logNode = ''; logs = ''; detail = null; detailAt = 0; notice(''); render(); await refresh(true); }
        else if (button.hasAttribute('data-refresh')) await refresh(true);
        else if (button.dataset.tab) { tab = button.dataset.tab; render(); if (tab === 'logs') { await loadLogs(); render(); } }
        else if (button.hasAttribute('data-log-refresh')) { await loadLogs(); render(); }
        else if (button.dataset.copy) { await navigator.clipboard.writeText(button.dataset.copy); toast('Endpoint copied'); }
        else if (button.dataset.action) {
          const action = button.dataset.action; pendingAction = { name:selected, action };
          $('#confirm-title').textContent = action[0].toUpperCase() + action.slice(1) + ' ' + selected + '?';
          $('#confirm-description').textContent = action === 'stop' ? 'Database nodes will stop. Your data, storage and infrastructure will remain in place. Cloud resources remain billable.' : action === 'restart' ? 'Database nodes will stop and start again. Connections may be interrupted while the cluster comes back online.' : action === 'resume' ? 'Continue the unfinished operation using its saved configuration.' : 'Start the database nodes using their saved configuration.';
          $('#confirm-action').textContent = action[0].toUpperCase() + action.slice(1); $('#confirmation').showModal();
        } else if (button.hasAttribute('data-check')) {
          checking = true; checkResult = null; render();
          try { checkResult = await api('/api/doctor', {target:checkTarget,protocol:checkProtocol}); } finally { checking = false; render(); }
        }
      } catch (error) { notice(error.message); }
    });
    content.addEventListener('change', async event => {
      if (event.target.id === 'check-target') { checkTarget = event.target.value; checkResult = null; render(); }
      if (event.target.id === 'check-protocol') { checkProtocol = event.target.value; checkResult = null; render(); }
      if (event.target.id === 'log-node') { logNode = event.target.value; await loadLogs(); render(); }
      if (event.target.id === 'follow-logs') { follow = event.target.checked; refresh(true); }
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
    try { provided = (await api('/api/session')).providedCredentials; await refresh(); }
    catch (error) { notice(error.message); }
  </script>
</body>
</html>
